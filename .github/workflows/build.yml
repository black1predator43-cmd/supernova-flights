name: Build Supernova Flights APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install Android API 36
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Extract project
        run: unzip -q SupernovaFlights-v0.1-2.zip

      - name: Build APK
        working-directory: SupernovaFlights
        run: gradle :app:assembleDebug --stacktrace

      - name: Package APK
        run: cp SupernovaFlights/app/build/outputs/apk/debug/app-debug.apk Supernova-Flights-v0.1-debug.apk

      - uses: actions/upload-artifact@v4
        with:
          name: supernova-flights-v0.1-apk
          path: Supernova-Flights-v0.1-debug.apk
          if-no-files-found: error
          retention-days: 30
